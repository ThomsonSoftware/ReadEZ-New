<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appearance and language</title>
<style>body{font-family:'Segoe UI',Arial,sans-serif;font-size:11pt;color:#414143;line-height:1.45;max-width:900px}
h1{font-size:20pt;color:#2969B3;margin:0 0 12px;padding-bottom:6px;border-bottom:3px solid #4F8CCB}h2{font-size:14pt;color:#1B4884;margin:18px 0 6px}
table{border-collapse:collapse;margin:8px 0 12px}th,td{border:1px solid #C4D6EC;padding:5px 9px;text-align:left;vertical-align:top}
th{background:#2969B3;color:#fff;font-weight:600}tr:nth-child(even) td{background:#F6F9FD}code{font-family:Consolas,monospace;font-size:10pt;background:#EBF2FA;padding:0 3px}
a{color:#2969B3}.note{background:#EBF2FA;border-left:4px solid #4F8CCB;padding:6px 10px;margin:10px 0}</style>
</head>
<body>
<h1>Appearance and language</h1>
<p>Colour scheme (light, dark or blue) and language (English, Spanish, German, Italian). Changes apply at once.</p>
</body>
</html>
